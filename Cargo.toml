[package]
name = "portless-contracts"
version = "1.0.5"
edition = "2021"
rust-version = "1.95"
license = "Elastic-2.0"
build = "build.rs"
include = [
  "build.rs",
  "Cargo.toml",
  "proto/portless/v1/control.proto",
  "src/lib.rs",
]

[features]
# gRPC client/server stubs and the tonic transport stack. Consumers that only
# need protobuf messages and enums disable default features.
default = ["grpc"]
grpc = ["dep:tonic", "dep:tonic-prost"]

[dependencies]
prost = "0.14"
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "transport"], optional = true }
tonic-prost = { version = "0.14.6", optional = true }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14.6"
